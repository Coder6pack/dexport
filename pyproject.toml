[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dexport"
version = "0.1.0"
description = "Control Discord Desktop via Chrome DevTools Protocol from the command line, with AI Summarization, Telegram Remote Control & Auto-Chat Persona."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Philip Lam" }
]
keywords = ["discord", "cdp", "chrome-devtools-protocol", "ai", "summarizer", "deepseek", "telegram-bot", "cli"]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "unidecode>=1.3.0",
]

[project.scripts]
dexport = "dexport.cli:main"

